name: minerlot

networks:
  minerlot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  bitcoind:
    build:
      context: ./bitcoin
      dockerfile: Dockerfile
    container_name: minerlot-bitcoind
    restart: unless-stopped
    networks:
      - minerlot
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
      - ./bitcoin/bitcoin.conf:/home/bitcoin/.bitcoin/bitcoin.conf:ro
    # No ports published: only reachable by other containers on the
    # "minerlot" network, never from the LAN or host.
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-datadir=/home/bitcoin/.bitcoin", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 5
      # After a restart mid-IBD, bitcoind replays/rolls forward recent
      # blocks and goes through RPC warmup (error -28 "Loading block
      # index...") before answering — observed taking up to ~2 minutes in
      # practice, well past a 30s start_period, which made public-pool's
      # `depends_on: condition: service_healthy` fail on more than one
      # redeploy. Generous on purpose; this only delays how long a
      # redeploy takes to report success, not anything at runtime once
      # both containers are actually up.
      start_period: 180s

  public-pool:
    build:
      context: ./public-pool
      dockerfile: Dockerfile
    container_name: minerlot-public-pool
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    networks:
      - minerlot
    ports:
      - "3333:3333/tcp" # stratum, must reach the LAN for Bitaxes
      - "3334:3334/tcp" # JSON status API, LAN-reachable
    volumes:
      - ./public-pool/mainnet-DB:/public-pool/DB
      - ./public-pool/.env:/public-pool/.env:ro
    environment:
      - NODE_ENV=production

  logs:
    build:
      context: ./logs-service
      dockerfile: Dockerfile
    container_name: minerlot-logs
    restart: unless-stopped
    networks:
      - minerlot
    volumes:
      - bitcoin-data:/data:ro
    environment:
      - LOG_PATH=/data/debug.log
    # No ports published: only reachable via nginx's reverse proxy (monitor
    # service). Reads bitcoind's debug.log directly off the shared volume —
    # no Docker socket access needed or granted.

  monitor:
    image: nginx:1.27-alpine
    container_name: minerlot-monitor
    restart: unless-stopped
    depends_on:
      - public-pool
      - logs
    networks:
      - minerlot
    ports:
      - "80:80/tcp" # dashboard, no auth, LAN only (see firewall notes in docs)
    volumes:
      - ./monitor/index.html:/usr/share/nginx/html/index.html:ro
      - ./monitor/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  bitcoin-data:
    name: minerlot_bitcoin-data
