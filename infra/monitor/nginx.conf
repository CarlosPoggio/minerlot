server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access, so the dashboard's JS never has to hardcode
    # a LAN IP — this is also what makes it work unchanged once reachable
    # through a public domain instead of the LAN IP (see docs/ROADMAP_PUBLIC_POOL.md).
    location /api/ {
        proxy_pass http://public-pool:3334/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live bitcoind log stream (WebSocket) for the dashboard's log viewer.
    location /logs-ws {
        proxy_pass http://logs:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
