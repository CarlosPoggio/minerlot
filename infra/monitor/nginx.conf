# Docker's embedded DNS (127.0.0.11), with a short TTL. Plain `proxy_pass
# http://host:port` resolves the hostname once when nginx starts and
# caches it for the worker's lifetime — if public-pool gets recreated
# (new container, new IP) without also restarting this container, nginx
# keeps talking to the stale IP and every request 502s until *this*
# container is restarted too. Using a variable in proxy_pass forces nginx
# to re-resolve at request time via this resolver instead.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access, so the dashboard's JS never has to hardcode
    # a LAN IP — this is also what makes it work unchanged once reachable
    # through a public domain instead of the LAN IP (see docs/ROADMAP_PUBLIC_POOL.md).
    location /api/ {
        # No path after the variable: with a variable, nginx passes the
        # original incoming URI through unmodified (unlike a literal
        # proxy_pass target, which would rewrite/strip the location
        # prefix) — and public-pool's own routes are already under /api
        # (app.setGlobalPrefix('api')), so that's exactly what we want.
        set $pool_upstream http://public-pool:3334;
        proxy_pass $pool_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
